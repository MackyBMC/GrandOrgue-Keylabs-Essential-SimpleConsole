# =======================================================
# COMBINATION SETTER CONFIGURATION
# Links your physical buttons directly to specific styles
# =======================================================
CombinationSetterRouting:
  # Sequential Stepping using your checked DAW Port (Index 3)
  PreviousButton: { DeviceIndex: 3, MIDIChannel: 1, EventType: CC, ControlNumber: 17, TriggerValue: 127 }
  NextButton: { DeviceIndex: 3, MIDIChannel: 1, EventType: CC, ControlNumber: 18, TriggerValue: 127 }
  
  # Absolute Jumps using the Part 1, Part 2, and Live Buttons (Main Port - Index 2, Channel 8)
  # Part 1 / Next jumps straight to the Playover Intro (000)
  DigitButton0: { DeviceIndex: 2, MIDIChannel: 8, EventType: CC, ControlNumber: 16, TriggerValue: 127 }
  
  # Part 2 / Prev jumps straight to the General Verse (001)
  DigitButton1: { DeviceIndex: 2, MIDIChannel: 8, EventType: CC, ControlNumber: 17, TriggerValue: 127 }
  
  # Live / Bank jumps straight to the Fading Finish (004)
  DigitButton4: { DeviceIndex: 2, MIDIChannel: 8, EventType: CC, ControlNumber: 18, TriggerValue: 127 }

