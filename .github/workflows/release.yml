name: release
# Stable v* tags build Windows and experimental Linux; macOS is deferred.
# A v*-linux.* tag builds only the experimental Linux package.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - id: platforms
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-linux.* ]]; then
            echo 'matrix={"include":[{"os":"ubuntu-22.04","name":"linux","experimental":true}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"windows-latest","name":"windows","experimental":false},{"os":"ubuntu-22.04","name":"linux","experimental":true}]}' >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-dev libxcb-cursor0 libgl1 patchelf ccache
      - run: pip install -r requirements.txt -r requirements-build.txt
      - run: python packaging/nuitka_build.py
      - name: Windows installer
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $appVersion = python -c "from version import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0 -or -not $appVersion) { throw "Could not read APP_VERSION from version.py." }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$appVersion" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }
          Compress-Archive -Path dist\keylab_go_bridge.dist\* -DestinationPath dist\installer\KeyLabGrandOrgueBridge-portable-windows.zip
      - name: Linux archive
        if: matrix.name != 'windows'
        run: |
          mkdir -p dist/installer
          tar -C dist -czf dist/installer/KeyLabGrandOrgueBridge-linux.tar.gz keylab_go_bridge.dist
      - uses: actions/upload-artifact@v4
        with: {name: "${{ matrix.name }}", path: dist/installer/*}
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - run: cd out && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            **Platform status:** Windows is supported; the Linux package is experimental and requires validation on real hardware. macOS is deferred. See the assets for the platforms included in this release.
            Settings live in your user folder and survive upgrades. Verify downloads with `SHA256SUMS.txt`.
