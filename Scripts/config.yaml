# KeyLab Essential 61 mk2  <->  GrandOrgue bridge - permanent settings
# Keep this file in the same folder as keylab_go_bridge.py (the Scripts folder).
# Anything typed on the command line (e.g. --verbose or --live 0.08) overrides the value here.
# Names below are matched as "part of the port name", upper/lower case does not matter.
# Run   python keylab_go_bridge.py --list   to see the exact port names on this PC.

# Initial mapped organ profile: Friesach. Additional organ profiles can provide
# their own organ_path and MIDI settings as they are added.
# Change this to the alternate file if required:
# C:\Audio\Sound Samples\GrandOrgue\Friesach_GrandOrgue\Friesach.organ
organ_path: 'C:\Audio\Sound Samples\GrandOrgue\Friesach_GrandOrgue\Friesach FullImageResolution.organ'

ports:
  go: "GO2Bridge"         # loopMIDI input carrying GrandOrgue -> bridge messages
  go_out: "Bridge2GO"     # loopMIDI output carrying bridge -> GrandOrgue messages
  keylab_in: "DAW"        # KeyLab DAW input (buttons, jog, faders, encoders)
  keylab_out: "KeyLab"    # KeyLab output that drives the LCD and button/pad LEDs (try "DAW" if the LCD stays blank)
  keylab_main_in: "Ess Midi In"    # KeyLab MAIN input, needed for the pads (blank = pad presses stop working, lights still do)

  # --- Fallback for machines where GrandOrgue and this script cannot BOTH open the KeyLab MAIN
  # port (some MIDI drivers refuse to share one device between two programs). When relay_main_out
  # is set, this script becomes the ONLY thing that opens the physical KeyLab, and forwards every
  # message (keys, pedal, wheels, pads) to a virtual port unchanged, the instant it arrives -
  # GrandOrgue then reads that virtual port instead of the KeyLab directly. You must also point
  # GrandOrgue's own MIDI input at relay_main_out (not at the KeyLab) for this to do anything.
  # Leave relay_main_out blank (the normal case) unless keylab_main_in keeps failing to open.
  relay_main_out: ""              # e.g. "KL2GO" - a virtual port name; create it in loopMIDI first
  relay_main_in: ""               # physical KeyLab MAIN port to relay from; defaults to keylab_main_in above

faders:
  threshold: 64           # fader value (0-127) at/above which a moved fader switches its stop on

display:
  hold: 1.0               # seconds a fader/encoder/bank readout stays before the normal display returns
  live: 0.04              # minimum seconds between LCD writes while a control moves (raise to 0.08 if the LCD misbehaves)
  refresh: 2.0            # re-send the normal display this often (seconds, 0 = never); repairs any overwrite by the keyboard

pads:
  enabled: true
  # CC sent by pads 1-8 in DAW mode (top row left to right, then bottom row), as measured on this keyboard.
  # Pad 4 and pad 5 share CC 40 - the bridge tells them apart (see shared_window). Check with --learn-pads.
  ccs: [36, 38, 39, 40, 40, 41, 42, 43]
  shared_window: 0.7      # seconds: a 'down' followed by a release within this time = pad 5 (momentary); no release = pad 4 (toggle)
  refresh: 2.0            # seconds between full re-sends of every pad/button LED (the keyboard forgets colours; 0 = never)
  dim: 0.10               # brightness of a pad whose stop is off, as a fraction of full (0 = dark)
  colors:                 # red, green, blue (0-127) of a pad whose stop is on, per division
    pedal: [0, 0, 127]
    hw: [0, 127, 0]
    sw: [127, 100, 0]
    sl: [127, 0, 0]
    other: [100, 0, 127]  # couplers and tremulants

controls:
  encoder_step: 2         # volume steps (0-127) per encoder click; fast turns move further
  volume_start: 100       # assumed starting level (0-127) of each volume until an encoder is turned
  jog_max_steps: 8        # most files the jog moves per message when turned very fast
  loop_restart: 0.4       # seconds to wait before restarting the MIDI player in Loop mode
  encoders:               # encoder number: pedal | hw | sw | sl | swell | noises | master
    1: pedal
    2: hw
    3: sl
    4: sw
    5: swell
    # 6: noises

# Optional short names (16 characters at most) for the LCD, keyed by GrandOrgue object path.
# The couplers are unnamed on the LCD until you say which is which, for example:
lcd_names: {}
#  "manuals/000/couplers/Coupler 1": "III/P"
#  "manuals/000/couplers/Coupler 2": "II/P"
#  "manuals/000/couplers/Coupler 3": "I/P"
#  "manuals/001/couplers/Coupler 4": "III/I"
#  "manuals/001/couplers/Coupler 5": "II/I"
#  "manuals/002/couplers/Coupler 6": "III/II"

verbose: true             # show incoming and outgoing MIDI messages in the bridge console

# The MIDI channels and CC numbers the bridge uses (commands 16, stops 15, feedback 14, volumes 12)
# are fixed by Friesach-midi-settings-KeyLab.yaml in GrandOrgue. Do not change them here.
